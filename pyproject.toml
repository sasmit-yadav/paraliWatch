[project]
name = "parali-watch"
version = "0.3.0"
description = "Forecasting crop-residue fires in Punjab and Haryana, with explanations and tools for officials and farmers."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15",
    "requests>=2.31",
    "h3>=4.1",
    "shapely>=2.0",
    "lightgbm>=4.3",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    # Phase 2: retrieval, agents, tools
    "fastembed>=0.5",
    "lancedb>=0.17",
    "rank-bm25>=0.2.2",
    "pypdf>=5.0",
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "pydantic>=2.6",
    "langgraph>=0.2",
    "mcp>=2.3",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.4"]
experiments = ["xgboost>=2.0", "torch>=2.2", "chronos-forecasting>=1.4"]
# Phase 3 (optional): burn-scar segmentation, voice input, LoRA fine-tuning
vision = ["torch>=2.2", "einops>=0.7", "rasterio>=1.3", "pystac-client>=0.7", "scipy>=1.11", "matplotlib>=3.8"]
voice = ["faster-whisper>=1.0", "av>=11,<17", "jiwer>=3.0"]  # av 17+ breaks faster-whisper 1.2 audio decoding
tune = ["torch>=2.2", "transformers>=4.45", "peft>=0.13"]
# Phase 4 (optional): experiment tracking and model registry
ops = ["mlflow>=3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["parali"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore:Using `httpx`"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# vendored from the official Prithvi-EO-2.0 release (only the timm imports were replaced)
"parali/detect/prithvi_mae.py" = ["B", "E501"]
