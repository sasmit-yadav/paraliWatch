[project]
name = "parali-watch"
version = "0.1.0"
description = "Forecasting crop-residue fires in Punjab and Haryana, with explanations and tools for officials and farmers."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15",
    "requests>=2.31",
    "h3>=4.1",
    "shapely>=2.0",
    "lightgbm>=4.3",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    # Phase 2: retrieval, agents, tools
    "fastembed>=0.5",
    "lancedb>=0.17",
    "rank-bm25>=0.2.2",
    "pypdf>=5.0",
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "pydantic>=2.6",
    "langgraph>=0.2",
    "mcp>=2.3",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.4"]
experiments = ["xgboost>=2.0", "torch>=2.2", "chronos-forecasting>=1.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["parali"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore:Using `httpx`"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
